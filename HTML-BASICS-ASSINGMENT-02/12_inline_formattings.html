<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline formatting</title>
</head>
<body>
      <!-- Multiple inline elements used together -->
    <p>
        <strong>Welcome</strong> to my <em>first web page</em>!
        I am <mark>learning</mark> <u>HTML</u> and writing
        <code>clean code</code> every day.
    </p>
</body>
</html>
