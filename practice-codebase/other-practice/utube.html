<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyTube</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        /* HEADER */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #ddd;
            z-index: 1000;
            /* justify-content: space-between; */
        }
        .header h2 {
            color: #d32f2f;
            width: 180px;
        }
        .header input {
            width: 400px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;

        }
       
        .profile {
            margin-left: auto;
            width: 32px;
            height: 32px;
            background: #777;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* SIDEBAR */
        .sidebar {
            position: fixed;
            top: 60px;
            left: 0;
            width: 180px;
            height: calc(100vh - 110px);
            background: white;
            padding-top: 15px;
            border-right: 1px solid #ddd;
        }
        .sidebar a {
            display: block;
            padding: 15px 18px;
            color: #333;
            text-decoration: none;
            font-size: 14px;
        }
        .sidebar a:hover {
            background: #eee;
        }
        /* MAIN CONTENT */
        .main {
            margin-left: 180px;
            padding: 85px 25px 70px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }
        .video-card {
            background: white;
        }
        .thumbnail {
            width: 100%;
            height: 120px;
            background: #ddd;
        }
        .video-card h3 {
            font-size: 14px;
            padding: 8px;
            color: #222;
        }
        /* FOOTER */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: #222;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }
        /* TABLET */
        @media (max-width: 1000px) {
            .main {
                grid-template-columns: repeat(3, 1fr);
            }
            .header input {
                width: 300px;
            }
        }
        /* SMALL TABLET */
        @media (max-width: 750px) {
            .main {
                grid-template-columns: repeat(2, 1fr);
            }
            .sidebar {
                width: 150px;
            }
            .main {
                margin-left: 150px;
            }
            .header h2 {
                width: 130px;
            }
            .header input {
                width: 250px;
            }
        }
        /* MOBILE */
        @media (max-width: 550px) {
            .sidebar {
                display: none;
            }
            .main {
                margin-left: 0;
                grid-template-columns: 1fr;
                padding: 80px 15px 65px;
            }
            .header input {
                width: 150px;
            }
            .header h2 {
                width: auto;
                margin-right: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <h2>MyTube</h2>
        <input class="search" type="text" placeholder="Search">
        <div class="profile">●</div>
    </header>
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <a href="#">Home</a>
        <a href="#">Trending</a>
        <a href="#">Subscriptions</a>
        <a href="#">Library</a>
        <a href="#">History</a>
        <a href="#">Watch Later</a>
    </aside>
    <!-- MAIN CONTENT -->
    <main class="main">
        <div class="video-card">
            <div class="thumbnail"></div>
            <h3>Video Title 1</h3>
        </div>
        <div class="video-card">
            <div class="thumbnail"></div>
            <h3>Video Title 2</h3>
        </div>
        <div class="video-card">
            <div class="thumbnail"></div>
            <h3>Video Title 3</h3>
        </div>
        <div class="video-card">
            <div class="thumbnail"></div>
            <h3>Video Title 4</h3>
        </div>
        <div class="video-card">
            <div class="thumbnail"></div>
            <h3>Video Title 5</h3>
        </div>
        <div class="video-card">
            <div class="thumbnail"></div>
            <h3>Video Title 6</h3>
        </div>
    </main>
    <!-- FOOTER -->
    <footer class="footer">
        <p>&copy; 2026 MyTube | All Rights Reserved</p>
    </footer>
</body>
</html>
