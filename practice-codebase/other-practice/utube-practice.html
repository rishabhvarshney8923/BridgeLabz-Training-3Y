<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       *{
        margin:0;
        padding: 0;
        box-sizing: border-box;
       }
       body{
        font-family: Arial, Helvetica, sans-serif;
        background: white;
       }
       .header{
        position: fixed;
        top:0;
        left: 0;
        height: 60px;
        width: 100%;
        background: white;
        display: flex;
        padding: 0 10px;
        align-items: center;
        border-bottom: 1px solid #ddd;
        z-index: 1000;
       }
       .header h2{
        color: red;
        width: 180px;
       }
       .header input {
            width:300px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;

        }
        .profile{
            margin-left: auto;
            width: 32px;
            height: 32px;
            color: white;
            background: gray;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
        }
        .sidebar{
            position: fixed;
            top: 60px;
            left: 0;
            width:180px;
            height:calc(100vh - 110px);
            background: white;
            padding: 15px;
            border-right:1px solid #ddd;
        }
        .sidebar a{
            display: block;
            text-decoration: none;
            padding:15px 18px;
            color:#333;
            font-size: 16px;

        }
        .sidebar a:hover{
            background: #eee;
        }
        .main{
            margin-left: 180px;
            padding: 85px 25px 70px;
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 20px;
        }
        .video-card{
            background: white;
        }
        .thumbnail{
            width: 100%;
            height: 120px;
            background: #ddd;
        }
        .video-card h3{
            font-size: 14px;
            padding: 8px;
            color:#333;
        }

    </style>
</head>
<body>
    <header class="header">
        <h2>myutbe</h2>
        <input type="text" class="search" name="search" placeholder="search">
        <div class="profile"></div>
    </header>
    <aside class="sidebar"> 
        <a href="#">qwerty</a>
        <a href="#">qwerty</a>
        <a href="#">qwerty</a>
        <a href="#">qwerty</a>
        <a href="#">qwerty</a>
        <a href="#">qwerty</a>
    </aside>
    <main class="main">
       <div class="video-card">
            <div class="thumbnail"></div>
            <h3>Video Title 1</h3>
        </div>
        <div class="video-card">
            <div class="thumbnail"></div>
            <h3>Video Title 2</h3>
        </div>
        <div class="video-card">
            <div class="thumbnail"></div>
            <h3>Video Title 3</h3>
        </div>
        <div class="video-card">
            <div class="thumbnail"></div>
            <h3>Video Title 4</h3>
        </div>
        <div class="video-card">
            <div class="thumbnail"></div>
            <h3>Video Title 5</h3>
        </div>
        <div class="video-card">
            <div class="thumbnail"></div>
            <h3>Video Title 6</h3>
        </div>
    </main>
</body>
</html>
